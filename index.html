<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="app-version" content="3.3.1">
<meta name="theme-color" content="#07A4B3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Maxi Básquet Live 2026 — torneo de maxi básquet femenino en vivo: resultados, goleadoras y estadísticas en tiempo real">
<title>PIQUE · Maxibásquet Cutral-Có 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900;1,62..125,700..900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C1013;--bg2:#11161B;--card:#161D23;--card2:#1C252D;--line:#26323C;--line2:#33424E;
  --text:#F4F7F8;--mute:#9AA7B0;--faint:#5C6873;
  --acc:#12B5C3;--acc2:#F08A1C;--accInk:#04161A;--accSoft:rgba(18,181,195,.14);--fire:#F08A1C;
  --sun:#F6E21C;--hot:#E53A2B;--blue:#2D8FD8;--jersey:#07A4B3;--jersey2:#068893;
  --good:#2BD47D;--bad:#FF4D5E;--info:#4DA3FF;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --r:16px;--r2:22px;
  --court1:#10181D;--court2:#141E25;--courtLine:#3FCAD5;--courtPaint:rgba(18,181,195,.16);
  --ff:'Archivo',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --fm:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F4F6F7;--bg2:#E9EEF0;--card:#FFFFFF;--card2:#F7F9FA;--line:#DDE5E8;--line2:#C5D2D7;
  --text:#101418;--mute:#55626B;--faint:#93A0A8;
  --acc:#0597A6;--acc2:#E57F12;--accInk:#FFFFFF;--accSoft:rgba(5,151,166,.10);--fire:#E57F12;
  --sun:#D9B800;--hot:#D9301F;--blue:#1F74C4;--jersey:#07A4B3;--jersey2:#068893;
  --good:#0E9F57;--bad:#D7263D;--info:#1C6FD1;
  --shadow:0 10px 28px rgba(60,40,10,.12);
  --court1:#E9C08C;--court2:#DDB07A;--courtLine:#FFFFFF;--courtPaint:rgba(5,151,166,.30);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--ff);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--fm)}
.wide{font-stretch:125%}
.cond{font-stretch:75%}
.mute{color:var(--mute)}
.hide{display:none!important}

/* ---------- top bar */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.ball{width:40px;height:40px;flex:none;border-radius:12px;object-fit:cover;box-shadow:0 0 0 1px var(--line2)}
.hero-logo{position:absolute;right:-18px;top:50%;transform:translateY(-50%);width:min(200px,42vw);aspect-ratio:1;border-radius:28px;opacity:.95;box-shadow:0 18px 40px rgba(0,0,0,.35);pointer-events:none}
.hero.has-logo{padding-right:min(210px,44vw);min-height:190px}
@media(max-width:520px){.hero-logo{width:120px;right:10px;top:14px;transform:none;border-radius:20px}.hero.has-logo{padding-right:18px;padding-top:146px}}
.tv-logo{height:9vh;width:9vh;border-radius:1.6vh;object-fit:cover}
.tv-foot .tv-logo{height:4vh;width:4vh;border-radius:.8vh}
.brand-t{min-width:0}
.brand-t b{display:block;font-stretch:125%;font-weight:900;text-transform:uppercase;font-size:15px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.brand-t small{white-space:nowrap;overflow:hidden;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.dot.on{background:var(--good);box-shadow:0 0 0 0 var(--good);animation:pulse 2s infinite}
.dot.live{background:var(--bad);animation:pulseR 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(43,212,125,.6)}70%{box-shadow:0 0 0 7px rgba(43,212,125,0)}100%{box-shadow:0 0 0 0 rgba(43,212,125,0)}}
@keyframes pulseR{0%{box-shadow:0 0 0 0 rgba(255,77,94,.7)}70%{box-shadow:0 0 0 8px rgba(255,77,94,0)}100%{box-shadow:0 0 0 0 rgba(255,77,94,0)}}
.nav-d{display:none;gap:4px}
.nav-d a{padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.nav-d a svg{display:none}
.nav-d a.on{color:var(--text);background:var(--card2)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none}
.icon-btn svg{width:20px;height:20px}
.role{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--mute);white-space:nowrap}
.role.adm{color:var(--accInk);background:var(--acc);border-color:var(--acc)}

/* ---------- bottom nav */
.nav-m{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav-m a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:10.5px;font-weight:700;color:var(--mute);letter-spacing:.03em;border-radius:12px}
.nav-m a svg{width:22px;height:22px}
.nav-m a.on{color:var(--acc)}
@media(min-width:900px){.nav-d{display:flex}.nav-m{display:none}body{padding-bottom:40px}}

/* ---------- layout */
main{max-width:1280px;margin:0 auto;padding:16px}
.h1{font-stretch:125%;font-weight:900;text-transform:uppercase;font-size:clamp(24px,5vw,40px);line-height:.95;letter-spacing:-.01em}
.h2{font-stretch:115%;font-weight:900;text-transform:uppercase;font-size:17px;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.h2::before{content:"";width:14px;height:4px;background:var(--acc);border-radius:2px;transform:skewX(-20deg)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.grid{display:grid;gap:12px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.pad0{padding:0;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;font-weight:800;font-size:13.5px;letter-spacing:.02em;background:var(--card2);border:1px solid var(--line2);white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.btn.ghost{background:transparent}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:10px}
.btn:disabled{opacity:.4;pointer-events:none}
.btn:active,.icon-btn:active{transform:scale(.97)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--card2);border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip.live{background:var(--bad);color:#fff;border-color:var(--bad)}
.chip.fin{color:var(--text)}
.chip.acc{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent);background:var(--accSoft)}
.tag-est{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acc2);border:1px dashed color-mix(in srgb,var(--acc2) 60%,transparent);padding:2px 7px;border-radius:6px;white-space:nowrap}
.empty{padding:30px 16px;text-align:center;color:var(--mute);border:1px dashed var(--line2);border-radius:var(--r)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 14px;border-radius:999px;font-weight:800;font-size:12.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--mute);background:var(--card);border:1px solid var(--line);white-space:nowrap}
.tab.on{color:var(--accInk);background:var(--text);border-color:var(--text)}
:root[data-theme="light"] .tab.on{color:#fff}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{white-space:nowrap;padding:7px 12px;border-radius:9px;font-weight:800;font-size:12px;color:var(--mute);letter-spacing:.02em}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.tcolor{width:10px;height:10px;border-radius:3px;flex:none;transform:skewX(-12deg)}
.badge{display:grid;place-items:center;border-radius:10px;font-weight:900;font-stretch:80%;color:#fff;flex:none;text-transform:uppercase;letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,0,.35);position:relative;overflow:hidden}
.badge{box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.badge::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-55deg,rgba(255,255,255,.0) 0 7px,rgba(255,255,255,.10) 7px 9px)}

/* ---------- hero / live */
.hero{position:relative;overflow:hidden;border-radius:var(--r2);border:1px solid var(--line);background:
 radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--acc) 28%,transparent) 0%,transparent 55%),
 linear-gradient(160deg,var(--card) 0%,var(--bg2) 100%);padding:18px}
.hero .seam{position:absolute;right:-60px;top:-60px;width:260px;height:260px;opacity:.12;pointer-events:none}
.match-card{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden;transition:border-color .2s}
.match-card:hover{border-color:var(--line2)}
.match-card.live{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.mc-top{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}
.mc-team{display:flex;align-items:center;gap:10px;padding:4px 0}
.mc-team .nm{flex:1;font-weight:800;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-team .sc{font-family:var(--fm);font-weight:800;font-size:20px;min-width:40px;text-align:right}
.mc-team.lose .nm,.mc-team.lose .sc{color:var(--mute)}
.mc-bar{position:absolute;left:0;top:0;bottom:0;width:4px}

/* ---------- scoreboard */
.sb{position:relative;border-radius:var(--r2);overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,var(--card) 0%,var(--bg2) 100%)}
.sb-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:14px 12px 10px}
.sb-team{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.sb-team .nm{font-weight:900;font-stretch:90%;text-transform:uppercase;font-size:13px;letter-spacing:.03em;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-score{font-family:var(--fm);font-weight:800;font-size:clamp(44px,12vw,84px);line-height:.9;letter-spacing:-.04em}
.sb-mid{display:flex;flex-direction:column;align-items:center;gap:6px}
.sb-clock{font-family:var(--fm);font-weight:800;font-size:clamp(22px,6vw,34px);padding:6px 12px;border-radius:12px;background:#000;color:#F6E21C;border:1px solid #2a2412;text-shadow:0 0 12px rgba(255,181,71,.45);letter-spacing:.02em;min-width:110px;text-align:center}
:root[data-theme="light"] .sb-clock{background:#141210;border-color:#141210}
.sb-clock.run{color:#F08A1C;text-shadow:0 0 14px rgba(240,138,28,.6)}
.sb-per{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.sb-meta .lbl{display:inline}
@media(max-width:480px){.sb-meta .lbl{display:none}.role{padding:5px 8px;font-size:10px}.top-in{gap:8px}}
.sb-meta{white-space:nowrap;display:flex;justify-content:space-between;gap:8px;padding:0 12px 12px;font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.fouls{display:flex;gap:3px;align-items:center}
.fouls i{width:8px;height:8px;border-radius:2px;background:var(--line2)}
.fouls i.on{background:var(--acc)}
.fouls.bonus i.on{background:var(--bad)}
.bonus-t{color:var(--bad);font-weight:900}
.sb-prog{height:4px;background:var(--line)}
.sb-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .9s linear}
.wp{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.wp-bar{flex:1;height:10px;border-radius:6px;overflow:hidden;display:flex;background:var(--line)}
.wp-bar i{display:block;height:100%;transition:width .6s ease}
.run-banner{display:flex;align-items:center;gap:8px;justify-content:center;padding:7px;font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;background:var(--accSoft);color:var(--acc);border-top:1px solid var(--line)}

/* ---------- console */
.console{display:grid;gap:12px;margin-top:12px}
@media(min-width:1000px){.console{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}}
.ctl-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:10px}
.btn-clock{min-width:140px;font-size:15px;padding:13px 18px}
.btn-clock.run{background:var(--bad);border-color:var(--bad);color:#fff}
.oncourt{display:grid;gap:8px}
.oc-team{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:2px}
.oc-team::-webkit-scrollbar{display:none}
.oc-lbl{width:44px;flex:none;display:flex;align-items:center;justify-content:center;height:52px;border-radius:12px;font-weight:900;font-stretch:80%;font-size:12px;color:#fff;text-transform:uppercase;letter-spacing:.02em}
.pchip{flex:1 0 56px;min-width:56px;height:52px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;position:relative}
.pchip b{font-family:var(--fm);font-weight:800;font-size:18px;line-height:1}
.pchip small{font-size:9.5px;font-weight:700;color:var(--mute);max-width:60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip.sel{border-color:var(--acc);background:var(--accSoft);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.pchip .pf{position:absolute;top:3px;right:4px;font-size:9px;font-weight:900;color:var(--mute)}
.pchip .pf.f4{color:var(--acc2)}
.pchip .pf.f5{color:var(--bad)}
.pchip.out5{opacity:.55;background:repeating-linear-gradient(-45deg,transparent 0 6px,rgba(255,77,94,.12) 6px 10px)}
.court-wrap{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--court1);touch-action:manipulation;user-select:none}
.court-wrap canvas{display:block;width:100%;height:auto}
.court-hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);padding:7px 12px;border-radius:999px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:800;letter-spacing:.03em;white-space:nowrap;pointer-events:none;display:flex;align-items:center;gap:6px}
.court-hint.loc{background:var(--acc);color:var(--accInk);animation:hint 1s ease-in-out infinite alternate}
@keyframes hint{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.05)}}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{height:62px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:900;font-size:12px;letter-spacing:.02em;text-transform:uppercase;font-stretch:90%}
.act span{font-size:20px;line-height:1;font-family:var(--fm);font-weight:800}
.act.g{color:var(--good)}
.act.r{color:var(--bad)}
.act.o{color:var(--acc)}
.act:active{transform:scale(.96);background:var(--card2)}
.feed{display:flex;flex-direction:column}
.fi{display:grid;grid-template-columns:52px 6px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}
.fi:last-child{border-bottom:0}
.fi .tm{font-family:var(--fm);font-size:11px;color:var(--mute);font-weight:700}
.fi .bar{width:4px;height:26px;border-radius:2px}
.fi .tx b{font-weight:800}
.fi .sc{font-family:var(--fm);font-size:12px;font-weight:800;color:var(--mute)}
.fi.pts .tx{color:var(--text)}
.fi.new{animation:flash 1.4s ease}
@keyframes flash{0%{background:var(--accSoft)}100%{background:transparent}}

/* ---------- tables */
.tbl-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--card)}
table.t{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
.t th{font-size:10.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:center;padding:10px 8px;border-bottom:1px solid var(--line);background:var(--card2);position:sticky;top:0}
.t td{text-align:center;padding:9px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.t tr:last-child td{border-bottom:0}
.t td.l,.t th.l{text-align:left}
.t td.stick,.t th.stick{position:sticky;left:0;background:var(--card);z-index:1}
.t th.stick{background:var(--card2);z-index:2}
.t td b{font-weight:900}
.t tr.q td{background:color-mix(in srgb,var(--good) 7%,transparent)}
.t tr.tot td{font-weight:900;background:var(--card2)}
.t .pos{font-family:var(--fm);font-weight:800;color:var(--mute);width:28px}
.t tr.oncrt td.stick{box-shadow:inset 3px 0 0 var(--acc)}
.hl{color:var(--acc);font-weight:900}

/* ---------- leaders / stat tiles */
.ldr{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ldr:last-child{border-bottom:0}
.ldr .rk{font-family:var(--fm);font-weight:800;color:var(--mute);width:18px}
.ldr .nm{flex:1;min-width:0}
.ldr .nm b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ldr .nm small{color:var(--mute);font-size:12px}
.ldr .v{font-family:var(--fm);font-weight:800;font-size:20px}
.ldr .v small{font-size:11px;color:var(--mute);font-family:var(--ff);margin-left:2px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .k{font-size:10.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.tile .v{font-family:var(--fm);font-weight:800;font-size:26px;line-height:1.1;margin-top:4px}
.tile .s{font-size:12px;color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.tiles{grid-template-columns:repeat(4,1fr)}}
.hbar{height:8px;border-radius:5px;background:var(--line);overflow:hidden}
.hbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.effort{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 12px;align-items:center}
.ring{--p:50;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring b{width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-family:var(--fm);font-size:12px;font-weight:800}

/* ---------- heat */
.heat-wrap{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.heat-wrap>*{min-width:0}
@media(min-width:900px){.heat-wrap{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:start}}
.legend{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--mute)}
.legend .grad{flex:1;height:8px;border-radius:5px;background:linear-gradient(90deg,#2b2d7a,#1d8fd1,#2bd4a8,#f2e33a,#ff8a1f,#ff2d3f)}
.zones-list{display:grid;grid-template-columns:1fr auto auto;gap:6px 12px;font-size:13px;align-items:center}
.zones-list .zp{font-family:var(--fm);font-weight:800}

/* ---------- bracket */
.bracket{display:flex;gap:18px;overflow-x:auto;padding:4px 2px 12px}
.br-col{display:flex;flex-direction:column;justify-content:space-around;gap:14px;min-width:220px}
.br-col h4{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);text-align:center}
.br-m{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
.br-m.live{border-color:var(--bad)}
.br-t{display:flex;align-items:center;gap:8px;padding:8px 10px;font-weight:800;font-size:13px}
.br-t+.br-t{border-top:1px solid var(--line)}
.br-t .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br-t .sc{font-family:var(--fm);font-weight:800}
.br-t.w{background:var(--accSoft)}
.br-t.ph .nm{color:var(--mute);font-weight:600;font-style:italic}
.champ{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-width:180px;text-align:center}
.champ .cup{font-size:40px}

/* ---------- forms / sheets */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.inp{width:100%;padding:12px 13px;border-radius:12px;background:var(--bg2);border:1px solid var(--line2);outline:none;font-size:15px}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accSoft)}
.inp.sm{padding:8px 10px;font-size:14px}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.ovl{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:620px;max-height:92vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .24s cubic-bezier(.2,.9,.3,1.1)}
@media(min-width:700px){.ovl{align-items:center}.sheet{border-radius:24px;padding-bottom:18px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-h h3{flex:1;font-stretch:115%;font-weight:900;text-transform:uppercase;font-size:17px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.pick{padding:10px 6px;border-radius:12px;background:var(--bg2);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px}
.pick b{font-family:var(--fm);font-size:20px;font-weight:800}
.pick small{font-size:11px;font-weight:700;color:var(--mute);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick.on{border-color:var(--acc);background:var(--accSoft)}
.pick.on small{color:var(--text)}
.pick.dis{opacity:.4}
.pop{position:fixed;z-index:90;background:var(--card);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);padding:12px;width:min(340px,calc(100vw - 24px));animation:fade .12s ease}
.pop-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-weight:900;text-transform:uppercase;font-size:13px;letter-spacing:.04em}
.pop .pv{font-family:var(--fm);font-size:22px;color:var(--acc)}
.pop-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pop-btns .btn{padding:14px 10px;font-size:15px}
.mini-pl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.mini-pl button{flex:1 0 52px;padding:8px 4px;border-radius:10px;background:var(--bg2);border:1.5px solid var(--line);font-family:var(--fm);font-weight:800;font-size:15px}
.mini-pl button.on{border-color:var(--acc);background:var(--accSoft)}
.mini-pl .tl{flex-basis:100%;font-family:var(--ff);font-size:10.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:0;border:0;background:none;text-align:left}
.ast-strip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));z-index:85;background:var(--card);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);padding:10px;display:flex;align-items:center;gap:6px;max-width:calc(100vw - 20px);overflow-x:auto;animation:up .2s ease}
.ast-strip .lb{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);padding:0 4px;white-space:nowrap}
.ast-strip button{min-width:46px;padding:9px 6px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);font-family:var(--fm);font-weight:800}
.ast-strip .tmr{height:3px;position:absolute;left:0;bottom:0;background:var(--acc);animation:shrink linear forwards}
@keyframes shrink{from{width:100%}to{width:0}}
@media(min-width:900px){.ast-strip{bottom:30px}}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);z-index:100;background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:800;font-size:13.5px;box-shadow:var(--shadow);animation:drop .25s ease;max-width:calc(100vw - 24px);text-align:center}
.toast.warn{background:var(--bad);color:#fff}
@keyframes drop{from{transform:translate(-50%,-14px);opacity:0}}
.upd{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:95;max-width:520px;margin:0 auto;background:var(--acc);color:var(--accInk);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:800;box-shadow:var(--shadow)}
.upd .btn{background:var(--accInk);color:var(--acc);border:0}
.credit{text-align:center;font-size:11px;color:var(--faint);padding:26px 16px 10px;font-weight:600;letter-spacing:.03em}
.mom{width:100%;height:150px;display:block}
.qtbl td:first-child,.qtbl th:first-child{text-align:left}
.pl-head{display:flex;align-items:center;gap:14px}
.jersey{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-family:var(--fm);font-weight:800;font-size:28px;color:#fff;position:relative;overflow:hidden;flex:none}
.jersey::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-55deg,transparent 0 9px,rgba(255,255,255,.12) 9px 12px)}
.list-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.share-box{display:flex;gap:8px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px;font-family:var(--fm);font-size:11.5px;color:var(--mute);overflow:hidden}
.share-box span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{font-size:12.5px;color:var(--mute);line-height:1.5}
.note b{color:var(--text)}
.kpis-mini{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute);font-weight:700}
.kpis-mini b{font-family:var(--fm);color:var(--text);font-size:15px;margin-right:3px}

/* ---------- TV */
body.tv{padding:0;overflow:hidden;background:#0A0D10}
body.tv .top,body.tv .nav-m,body.tv .credit{display:none}
.tvw{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);gap:1.6vh;padding:2.2vh 2.2vw;color:#F4F7F8;background:
 radial-gradient(80% 70% at 50% -10%,rgba(18,181,195,.16),transparent 60%),radial-gradient(60% 50% at 100% 100%,rgba(240,138,28,.12),transparent 60%),transparent;font-family:var(--ff);z-index:1}
.tv-sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:2vw;background:linear-gradient(180deg,rgba(24,31,38,.88),rgba(16,21,26,.82));border:1px solid #2A3742;border-radius:2.4vh;padding:1.6vh 2vw;position:relative;overflow:hidden}
.tv-tm{display:flex;align-items:center;gap:1.4vw;min-width:0}
.tv-tm.r{flex-direction:row-reverse;text-align:right}
.tv-tm .bd{width:9vh;height:9vh;border-radius:2vh;font-size:3.4vh}
.tv-tm .nm{font-stretch:110%;font-weight:900;text-transform:uppercase;font-size:3.6vh;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-tm .sub{font-size:1.7vh;color:#9AA7B0;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-top:.6vh;display:flex;gap:1vw;align-items:center}
.tv-tm.r .sub{justify-content:flex-end}
.tv-tm .sc{font-family:var(--fm);font-weight:800;font-size:13vh;line-height:.85;letter-spacing:-.05em;margin:0 1vw}
.tv-mid{display:flex;flex-direction:column;align-items:center;gap:1vh}
.tv-clock{font-family:var(--fm);font-weight:800;font-size:7vh;color:#F6E21C;background:#000;padding:.6vh 2vw;border-radius:1.4vh;border:1px solid #2a2412;text-shadow:0 0 2vh rgba(255,181,71,.5)}
.tv-clock.run{color:#F08A1C}
.tv-per{font-weight:900;letter-spacing:.3em;text-transform:uppercase;font-size:1.9vh;color:#9AA7B0}
.tv-body{display:grid;grid-template-columns:1.05fr 1fr;gap:1.6vw;min-height:0}
.tv-panel{background:rgba(20,26,32,.8);border:1px solid #2A3742;border-radius:2.4vh;padding:2vh 1.6vw;display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative}
.tv-panel h3{font-stretch:115%;font-weight:900;text-transform:uppercase;font-size:2.2vh;letter-spacing:.06em;color:#12B5C3;margin-bottom:1.4vh;display:flex;align-items:center;gap:1vw}
.tv-panel h3 small{color:#9AA7B0;font-weight:700;letter-spacing:.08em;font-size:1.6vh}
.tv-court{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.tv-court canvas{max-width:100%;max-height:100%;border-radius:1.4vh}
.tv-rot{flex:1;min-height:0;animation:fade .6s ease}
.tv-ldr{display:flex;align-items:center;gap:1.2vw;padding:1.1vh 0;border-bottom:1px solid #26323C;font-size:2.3vh}
.tv-ldr .nm{flex:1;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-ldr .v{font-family:var(--fm);font-weight:800;font-size:3.2vh;color:#F6E21C}
.tv-ldr .k{font-size:1.5vh;color:#9AA7B0;font-weight:800;letter-spacing:.12em;text-transform:uppercase;width:9vw}
.tv-foot{display:flex;align-items:center;gap:2vw;font-size:1.7vh;color:#77848D;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tv-ticker{flex:1;overflow:hidden;white-space:nowrap;color:#D5DDE2}
.tv-ticker span{display:inline-block;padding-left:100%;animation:tick 40s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
.tv-feed .fi{font-size:2.1vh;grid-template-columns:7vw 6px 1fr auto;padding:1vh .4vw;border-color:#26323C}
.tv-feed .fi .tm,.tv-feed .fi .sc{font-size:1.7vh}
.tv-wp .wp-bar{height:2.2vh;border-radius:1.2vh}
.tv-exit{position:fixed;right:12px;top:12px;z-index:5;opacity:0;transition:opacity .3s;background:#1E1E25!important;color:#F4F7F8!important;border-color:#3A3A45!important}
.tvw:hover .tv-exit{opacity:1}

/* ---------- v2: categorías, sedes, carga rápida */
.badge.logo{background:#fff;border:2px solid var(--line2)}
.badge.logo::after{display:none}
.badge.logo img{width:100%;height:100%;object-fit:contain;display:block}
.cat-tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;background:var(--text);color:var(--bg);font-size:10.5px;font-weight:900;letter-spacing:.04em;font-stretch:90%;white-space:nowrap}
.mc-top .cat-tag{margin-right:2px}
.mc-city{display:block;font-size:11px;color:var(--mute);font-weight:600;line-height:1.1}
.mc-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--mute);font-weight:700}
.mc-ts{color:var(--acc);font-weight:800}
.chip.st-half{background:var(--acc2);color:#1a1000;border-color:var(--acc2)}
.chip.st-warn{color:var(--acc2);border-color:color-mix(in srgb,var(--acc2) 50%,transparent);background:color-mix(in srgb,var(--acc2) 12%,transparent)}
.chip.st-bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.tab.sm{padding:7px 12px;font-size:11.5px}
.role.op{color:#fff;background:var(--info);border-color:var(--info)}
.op-card{border-color:var(--info);background:color-mix(in srgb,var(--info) 8%,var(--card))}
.op-card .eyebrow{color:var(--info)}
.lh-top{display:flex;align-items:center;gap:8px;padding:10px 12px 0;font-size:11.5px;font-weight:800;color:var(--mute)}
.note-bar{margin-bottom:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--acc2) 14%,var(--card));border:1px solid color-mix(in srgb,var(--acc2) 40%,transparent);font-size:13px;font-weight:700}
.st-bar{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.lock-card{margin-top:12px;border-color:var(--acc2);background:color-mix(in srgb,var(--acc2) 8%,var(--card))}
.vb-grid{display:grid;gap:14px}
@media(min-width:900px){.vb-grid{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}}
.vb{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.vb-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vb-h b{display:block;font-stretch:115%;font-weight:900;text-transform:uppercase;font-size:16px;line-height:1.1}
.vb-h small{color:var(--mute);font-weight:700;font-size:12px}
.vb-pin{width:36px;height:36px;border-radius:12px;background:var(--accSoft);color:var(--acc);display:grid;place-items:center;flex:none}
.vb-pin svg{width:20px;height:20px}
.vb .sb{margin-top:6px}
.vb-free{padding:22px;text-align:center;border:1px dashed var(--line2);border-radius:var(--r);color:var(--mute);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.vb-ts{font-size:12.5px;padding:6px 2px;color:var(--mute)}
.vb-ts b{color:var(--text)}
.vb-sub{font-size:10.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.vb-line{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--bg2);font-size:13px;font-weight:700}
.vb-t{color:var(--acc);font-weight:800;font-size:12px;width:40px}
.vb-n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vb-empty{font-size:12px;color:var(--faint);padding:4px 2px}
.cat-row{padding:10px 0;border-bottom:1px solid var(--line)}
.cat-row:last-of-type{border-bottom:0}
.mini-l{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--mute)}
.sched-box{margin-top:14px;padding:12px;border-radius:14px;background:var(--bg2);border:1px dashed var(--line2)}
.logo-up{width:84px;height:84px;border-radius:20px;border:2px dashed var(--line2);display:grid;place-items:center;cursor:pointer;overflow:hidden;background:#fff;flex:none;color:#777;font-size:12px;font-weight:800;text-align:center}
.logo-up img{width:100%;height:100%;object-fit:contain}
/* carga rápida */
.qc{display:grid;gap:12px;margin-top:12px}
@media(min-width:760px){.qc{grid-template-columns:1fr 1fr}}
.qc-team{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.qc-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:3px solid;font-weight:900;font-size:14px}
.qc-h b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.qc-sc{font-weight:800;font-size:24px}
.qc-tf{font-size:11px;font-weight:900;color:var(--mute);white-space:nowrap}
.qc-tf.bonus{color:var(--bad)}
.qc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;padding:8px}
.qc-p{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 4px 6px;border-radius:12px;background:var(--bg2);border:2px solid transparent;border-top:3px solid var(--tc)}
.qc-p b{font-size:22px;font-weight:800;line-height:1}
.qc-p small{font-size:11px;font-weight:800;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qc-st{display:flex;flex-direction:column;align-items:center;font-style:normal;font-size:10px;color:var(--mute);font-weight:800;line-height:1.25}
.qc-st i{font-style:normal}
.qc-st .f4{color:var(--acc2)}
.qc-st .f5{color:var(--bad)}
.qc-p.sel{border-color:var(--acc);background:var(--accSoft);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.qc-p.out5{opacity:.5}
.qc-bar{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom));z-index:30;margin-top:12px;padding:8px!important;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line2);border-radius:20px;padding:10px;box-shadow:var(--shadow)}
@media(min-width:900px){.qc-bar{bottom:12px}}
.qc-who{text-align:center;font-size:12.5px;margin-bottom:6px;min-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qc-btns{display:grid;grid-template-columns:repeat(3,1fr) 1.25fr;gap:8px}
.qb{height:56px;border-radius:16px;font-family:var(--fm);font-weight:800;font-size:26px;color:#fff}
.qb.g{background:linear-gradient(180deg,#22C3CE,#0E8F9A)}
.qb.o{background:linear-gradient(180deg,#F08A1C,#D9650B);font-family:var(--ff);font-size:16px;font-weight:900;letter-spacing:.04em}
.qb:active{transform:scale(.96)}
.qc-sec{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px}
.qc-sec::-webkit-scrollbar{display:none}
.qc-sec .btn{font-size:11px;padding:6px 10px;flex:none}
/* panel de sedes en TV */
.tv-org .tv-org-h{display:flex;align-items:flex-end;gap:2vw}
.tv-org-t{font-stretch:115%;font-weight:900;text-transform:uppercase;font-size:5vh;line-height:1}
.tv-org-k{font-size:2.2vh;color:#9AA7B0;font-weight:700}
.tv-org-k b{color:#F6E21C;font-family:var(--fm)}
.tv-org-g{display:grid;gap:1.6vw;min-height:0;min-width:0}
.vb.tv .cat-tag{background:#F6E21C;color:#1a1000;font-size:1.5vh}
.vb.tv .sb-team .nm{font-size:2vh}
.vb.tv .sb-in{padding:1.6vh 1vw 1vh}
.vb.tv{background:rgba(20,26,32,.82);border-color:#2A3742;color:#F4F7F8;font-size:2vh;overflow:hidden;--card:#1A222A;--bg2:#1A222A;--line:#26323C;--line2:#33424E;--text:#F4F7F8;--mute:#9AA7B0;--faint:#5C6873}
.vb.tv .vb-h b{font-size:3vh}
.vb.tv .vb-line{font-size:2vh;padding:1vh 1vw}
.vb.tv .vb-t{font-size:1.8vh;width:5vw}
.vb.tv .sb-score{font-size:8vh}

const LogoFX = (() => {
  const RM = matchMedia('(prefers-reduced-motion: reduce)');
  const S = LOGO3.S, [BX, BY, BR] = LOGO3.ball;
  let t = 0, last = 0, raf = 0, tiltX = 0, tiltY = 0, tx = 0, ty = 0;
  const pct = v => (v / S * 100) + '%';
  const layer = (k, z, cls) => { const L = LOGO3[k]; return `<img class="l3 ${cls || ''}" data-k="${k}" src="${L.d}" alt="" style="left:${pct(L.x)};top:${pct(L.y)};width:${pct(L.w)};height:${pct(L.h)};--z:${z}px">`; };
  function build(el) {
    const tl = typeof torneoLogo === 'function' && torneoLogo();
    if (tl) { el.innerHTML = `<div class="l3-stage"><div class="l3-ring"></div><div class="l3-glow"></div><div class="l3-rig"><img src="${tl}" alt="" style="left:6%;top:6%;width:88%;height:88%;object-fit:contain;transform:translateZ(30px)"></div></div>`; el.dataset.built = 'img'; return; }
    el.innerHTML = `<div class="l3-stage"><div class="l3-ring"></div><div class="l3-glow"></div>
      <div class="l3-rig">${layer('back', 0)}<canvas class="l3-fxb" width="280" height="280"></canvas>
      <div class="l3-girl" data-g>${layer('girl', 0)}</div>
      <canvas class="l3-ball" width="200" height="200"></canvas>
      <div class="l3-girl l3-fing" data-g>${layer('fing', 0)}</div>
      ${layer('banner', 0, 'l3-ban')}<div class="l3-shine" style="-webkit-mask-image:url(${LOGO3.mask});mask-image:url(${LOGO3.mask})"></div>
      <canvas class="l3-fx" width="560" height="560"></canvas></div></div>`;
    el.dataset.built = '1';
  }
  // ---- coreografía (segundos): 3 piques · cruce · 2 piques · cruce · tiro
  const CY = 9.6;
  function lerp(a, b, k) { return a + (b - a) * k; }
  const ease = k => k * k * (3 - 2 * k);
  const L_H = [BX, BY], R_H = [356, 300], FLOOR = 374;
  function play(T) {
    const c = T % CY, o = { gx: 0, gy: 0, gr: 0, bx: BX, by: BY, bs: 0, sx: 1, sy: 1, z: 1, vis: 1, spin: 0, trail: false, shot: 0, hit: 0 };
    const bounce = (hand, k, side) => {            // un pique completo: mano → piso → mano
      const dd = 1 - Math.abs(Math.cos(k * Math.PI)), d = dd, floor = dd > .88 ? (dd - .88) / .12 : 0;   // lenta en la mano, golpe seco en el piso
      o.bx = hand[0] + Math.sin(k * Math.PI) * 4 * side; o.by = lerp(hand[1], FLOOR, dd);
      o.sx = 1 + floor * .16; o.sy = 1 - floor * .2; o.gy = 4.5 * dd; o.gr = -1.6 * dd * side; o.gx = 1.5 * dd * side; o.spin = k * 6.28 * side;
    };
    const cross = (from, to, k, side) => {          // cruce por abajo con pique en el centro
      const x = lerp(from[0], to[0], ease(k)), mid = Math.sin(k * Math.PI);
      o.bx = x; o.by = lerp(lerp(from[1], to[1], k), FLOOR, Math.pow(mid, .55));
      if (mid > .93) { const f = (mid - .93) / .07; o.sx = 1 + f * .16; o.sy = 1 - f * .2; }
      o.gx = lerp(-3 * side, 5 * side, ease(k)); o.gr = lerp(-2.5 * side, 3 * side, ease(k)); o.gy = 5 * mid; o.spin = k * 9 * side; o.trail = true;
    };
    if (c < 2.4) bounce(L_H, (c / .8) % 1, 1);
    else if (c < 3.1) cross(L_H, R_H, (c - 2.4) / .7, 1);
    else if (c < 4.7) { bounce(R_H, ((c - 3.1) / .8) % 1, -1); o.gx += 5; o.gr += 3; }
    else if (c < 5.4) cross(R_H, L_H, (c - 4.7) / .7, -1);

/* =====================================================================
   VOTACIÓN DEL PÚBLICO · JUGADORA DEL PARTIDO
   · Se vota desde cualquier celular con el link público (sin usuario).
   · Un voto por celular y por partido; el servidor decide si la votación
     está abierta (último cuarto y hasta N minutos después del final) y
     limita los votos masivos desde una misma conexión.
   · Los conteos viajan agrupados (pocos bytes), no voto por voto.
   ===================================================================== */
const Vote = (() => {
  const VOTER = (() => { let v = localStorage.getItem('maxi_voter'); if (!v || v.length < 16) { v = uid() + uid() + uid(); localStorage.setItem('maxi_voter', v); } return v; })();
  const cache = {};          // gid → { votos:{pid:n}, total, abierta, at }
  let winners = null, winnersAt = 0;
  const myKey = gid => 'maxi_voto_' + S.meta.code + '_' + gid;
  const mine = gid => { try { return JSON.parse(localStorage.getItem(myKey(gid)) || 'null'); } catch (e) { return null; } };
  const on = () => !!(Sync.cl && Sync.cfg().u) && S.meta.voteOn !== false;
  const winMin = () => S.meta.voteMin || 15;
  /* misma regla que el servidor (el servidor es el que manda) */
  function state(g) {
    if (!on() || !g || g.deleted || !ready(g)) return 'off';
    if (g.vote === 'closed') return 'closed';
    const st = g.status;
    if (g.vote === 'open') return (st === 'live' || st === 'half' || st === 'final') ? 'open' : 'soon';
    if (st === 'live' || st === 'half') return (g.clock.period || 1) >= S.meta.quarters ? 'open' : 'soon';
    if (st === 'final') return (g.endedAt || 0) + winMin() * 60000 > Date.now() ? 'open' : 'closed';
    return 'soon';
  }
  const closesAt = g => g.status === 'final' && g.vote !== 'open' ? (g.endedAt || 0) + winMin() * 60000 : null;
  async function count(gid, force) {
    const c = cache[gid]; if (!force && c && Date.now() - c.at < 15000) return c;
    const r = await Sync.voteCount(gid); if (r) cache[gid] = { ...r, at: Date.now() };
    return cache[gid] || { votos: {}, total: 0, abierta: false };
  }
  async function cast(g, side, pid) {
    const t = sideTeam(g, side);
    const r = await Sync.vote(g.id, pid, t && t.id, VOTER);
    if (r && (r.ok || r.ya)) { localStorage.setItem(myKey(g.id), JSON.stringify({ pid, side, at: Date.now(), ya: !!r.ya })); if (r.conteo) cache[g.id] = { ...r.conteo, at: Date.now() }; }
    return r;
  }
  async function allWinners(force) {
    if (!Sync.cl) return {};
    if (!force && winners && Date.now() - winnersAt < 60000) return winners;
    winners = (await Sync.voteWinners()) || {}; winnersAt = Date.now(); return winners;
  }
  /* jugadoras que se pueden votar: las que jugaron; si no hay datos de minutos, todo el plantel */
  function candidates(g, c) {
    const out = [];
    ['H', 'A'].forEach(s => {
      const t = sideTeam(g, s); if (!t) return;
      const P = c.P[s] || {}, played = t.players.filter(p => { const x = P[p.id]; return x && (x.gp || x.sec > 0 || x.pts || x.fga || x.fta || x.pf || x.or || x.dr || x.ast); });
      (played.length >= 3 ? played : t.players).forEach(p => out.push({ s, t, p, st: P[p.id] || mkP() }));
    });
    return out;
  }
  const statLine = x => `${x.st.pts} pts${x.st.or + x.st.dr ? ' · ' + (x.st.or + x.st.dr) + ' reb' : ''}${x.st.ast ? ' · ' + x.st.ast + ' ast' : ''}`;
  return { state, closesAt, count, cast, allWinners, candidates, statLine, mine, cache, on, VOTER };
})();

       <div class="p3-note">Recreación con los datos de la mesa · el lugar del tiro es real; poses y defensa, ilustrativas</div>`;
    }
    resize(); buildHud();
    const onR = () => resize(); window.addEventListener('resize', onR);
    raf = requestAnimationFrame(frame);
    return {
      stop() { done = true; cancelAnimationFrame(raf); window.removeEventListener('resize', onR); },
      replay() { t0 = 0; paused = false; sparks.length = 0; },
      duration: T_END + .8
    };
  }

  /* ---------------- reproductor a pantalla completa ---------------- */
  let cur = null;
  function close() { if (cur) { cur.ctl && cur.ctl.stop(); cur.el.remove(); clearTimeout(cur.to); cur = null; document.body.classList.remove('p3-open'); } }
  function open(g, list, idx = 0, o = {}) {
    close(); if (!list || !list.length) return;
    const el = document.createElement('div'); el.className = 'p3-ovl' + (o.tv ? ' tv' : ''); el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Repetición 3D');
    el.innerHTML = `<canvas class="p3-cv"></canvas><div class="p3-hud"></div>
     ${o.tv ? '' : `<div class="p3-ctl"><button class="btn sm" data-p3="prev" ${idx ? '' : 'disabled'} aria-label="Anterior">‹</button><button class="btn sm" data-p3="again">↻ Repetir</button><span class="p3-n">${idx + 1} / ${list.length}</span><button class="btn sm" data-p3="next" ${idx < list.length - 1 ? '' : 'disabled'} aria-label="Siguiente">›</button><button class="btn sm pri" data-p3="close">Cerrar</button></div>`}`;
    document.body.appendChild(el); document.body.classList.add('p3-open');
    const ctl = scene(el.querySelector('.p3-cv'), el.querySelector('.p3-hud'), g, list[idx], { onEnd: () => {
      if (!cur || cur.ended) return; cur.ended = true;
      if (o.tv) cur.to = setTimeout(close, 900);
      else if (o.reel && idx < list.length - 1) cur.to = setTimeout(() => open(g, list, idx + 1, o), 900);
    } });
    cur = { el, ctl, ended: false };
    el.addEventListener('click', e => { const b = e.target.closest('[data-p3]'); if (!b) return; const a = b.dataset.p3;
      if (a === 'close') close(); else if (a === 'again') { cur.ended = false; ctl.replay(); } else if (a === 'next') open(g, list, idx + 1, { ...o, reel: false }); else if (a === 'prev') open(g, list, idx - 1, { ...o, reel: false }); });
  }
  document.addEventListener('keydown', e => { if (cur && e.key === 'Escape') close(); });
  return { plays, top, open, close, label, clockOf, isOpen: () => !!cur };
})();

/* ---------------- pestaña "Jugadas 3D" del partido ---------------- */
function vPlays3D(g) {
  const all = P3D.plays(g), made = all.filter(x => x.made), tp = P3D.top(g, 5);
  if (!all.length) return `<div class="empty" style="margin-top:10px"><b>Todavía no hay jugadas con ubicación</b>Las jugadas 3D se arman con los tiros que la mesa carga <b>tocando la cancha</b> (modo "Completa con cancha"). Conviene usarlo al menos en semifinales y finales.</div>`;
  const card = (x, i, list, rank) => `<button class="p3-card" data-act="p3open" data-id="${g.id}" data-list="${list}" data-i="${i}" style="--c:${esc(x.t.color)}">
    <span class="p3-mini" aria-hidden="true">${miniCourt(x)}</span>
    <span class="p3-ci">${rank ? `<span class="p3-rank">${rank}</span>` : ''}<b>#${esc(x.p ? x.p.num : '')} ${esc(x.p ? x.p.name : x.t.name)}</b><small>${esc(x.t.short)} · ${esc(P3D.label(x))} · ${esc(P3D.clockOf(x))}</small>${x.tags.length ? `<span class="p3-tags">${x.tags.slice(0, 2).map(t => `<span>${esc(t)}</span>`).join('')}</span>` : ''}</span><span class="p3-play">▶</span></button>`;
  return `<div class="sec-h" style="margin-top:12px;flex-wrap:wrap"><h2 class="h2">Las mejores del partido</h2><span class="sp"></span>${tp.length ? `<button class="btn sm pri" data-act="p3reel" data-id="${g.id}">▶ Ver el top ${tp.length} seguido</button>` : ''}</div>
   ${tp.length ? `<div class="p3-grid">${tp.map((x, i) => card(x, i, 'top', i + 1)).join('')}</div>` : '<p class="note">Todavía no hay canastas con ubicación.</p>'}
   <div class="sec-h" style="margin-top:18px"><h2 class="h2">Todos los tiros con ubicación</h2><span class="chip">${made.length} de ${all.length} adentro</span></div>
   <div class="p3-grid">${all.slice().reverse().map(x => card(x, all.indexOf(x), 'all')).join('')}</div>
   <p class="note" style="margin-top:10px">Recreación 3D con los datos que carga la mesa: el lugar del tiro, quién tiró, si entró, la asistencia y el rebote. Las poses, la defensora y la posición de quien asiste cuando no se marcó en la cancha son ilustrativas.</p>`;
}
function miniCourt(x) {
  const sx = v => (v / 15 * 60).toFixed(1), sy = v => (v / 14 * 56).toFixed(1);
  return `<svg viewBox="0 0 60 56" width="60" height="56"><rect x=".5" y=".5" width="59" height="55" rx="4" fill="rgba(255,255,255,.04)" stroke="rgba(255,255,255,.18)"/><path d="M3.6 .5 V11.8 A27 27 0 0 0 56.4 11.8 V.5" fill="none" stroke="#F6E21C" stroke-opacity=".7"/><rect x="20.2" y=".5" width="19.6" height="22.7" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.25)"/><circle cx="30" cy="6.3" r="1.8" fill="none" stroke="#F26A1B"/><line x1="${sx(x.x)}" y1="${sy(x.y)}" x2="30" y2="6.3" stroke="${x.made ? '#F6E21C' : '#9AA7B0'}" stroke-dasharray="2 2"/><circle cx="${sx(x.x)}" cy="${sy(x.y)}" r="3.4" fill="${esc(x.t.color)}" stroke="#fff" stroke-width="1.2"/></svg>`;
}
/* ---------------- TV: repetición automática de cada canasta ---------------- */
const TV3D = { seen: null, gid: null };
function tvAutoReplay(g) {
  if (!g || localStorage.getItem('tbf_tv3d') === '0') return;
  const ids = new Set(g.events.map(e => e.id));
  if (TV3D.gid !== g.id || !TV3D.seen) { TV3D.gid = g.id; TV3D.seen = ids; return; }
  const fresh = g.events.filter(e => !TV3D.seen.has(e.id)); TV3D.seen = ids;
  const sh = fresh.filter(e => e.t === 'shot' && e.made && e.x != null && !e.del && Date.now() - (e.ts || Date.now()) < 60000).pop();
  if (!sh || P3D.isOpen()) return;
  setTimeout(() => { const list = P3D.plays(S.games[g.id]), i = list.findIndex(x => x.e.id === sh.id); if (i >= 0 && !P3D.isOpen()) P3D.open(S.games[g.id], list, i, { tv: true }); }, 2500);   // espera la asistencia
}
const P3D_ACTIONS = {
  p3open: el => { const g = S.games[el.dataset.id]; if (!g) return; const list = el.dataset.list === 'top' ? P3D.top(g, 5) : P3D.plays(g); P3D.open(g, list, +el.dataset.i || 0); },
  p3reel: el => { const g = S.games[el.dataset.id]; if (!g) return; P3D.open(g, P3D.top(g, 5), 0, { reel: true }); },
  p3ev: el => { const g = S.games[el.dataset.g]; if (!g) return; const list = P3D.plays(g), i = list.findIndex(x => x.e.id === el.dataset.e); if (i >= 0) P3D.open(g, list, i); }
};

  return `<span class="badge" style="width:${size}px;height:${size}px;background:${esc(t.color)};font-size:${Math.round(size * (t.short && t.short.length > 3 ? .28 : .34))}px">${esc(t.short || t.name.slice(0, 3))}</span>`;

  openSheet(title, `<div class="grid g2">${[['H', th], ['A', ta]].map(([s, t]) => `<button class="btn" style="height:64px;justify-content:flex-start;gap:12px" data-s="${s}">${badge(t, 36)}${esc(t.name)}</button>`).join('')}</div>`, sh => $$('[data-s]', sh).forEach(b => b.onclick = () => { closeSheet(); cb(b.dataset.s); }));
}
function padAct(g, t) {
  if (t === 'undo') {
    const mine = g.events.filter(e => !e.del && e.dev === DEV).sort((a, b) => b.ts - a.ts)[0] || g.events.filter(e => !e.del).sort((a, b) => b.ts - a.ts)[0];
    if (!mine) return toast('No hay nada para deshacer');
    mine.del = true; Ledger.mark(g, mine); commitGame(g, false); toast('Se deshizo la última jugada'); return;
  }
  if (t === 'sub') { if (UI.sel) { const s = UI.sel.side; UI.sel = null; return subSheet(g, s); } return sidePick(g, '¿Cambio de qué equipo?', s => subSheet(g, s)); }
  if (t === 'to') return sidePick(g, '¿Quién pide tiempo muerto?', s => { rec(g, { t: 'to', side: s }); if (g.clock.running) { g.clock.rem = clockRem(g.clock); g.clock.running = false; g.clock.ts = Date.now(); commitGame(g, false); } toast('Tiempo muerto · reloj pausado'); });
  const lbl = PAD.find(x => x[0] === t)[1];
  const allowTeam = ['oreb', 'dreb', 'tov'].includes(t);
  selectedOrAsk(g, lbl + ' · ¿de quién?', allowTeam, (side, pid) => doAct(g, t, side, pid));
}
function clockToggle(g) {
  const c = g.clock;
  if (c.running) { c.rem = clockRem(c); c.running = false; }
  else { if (c.rem <= 0) return; c.at = Date.now(); c.running = true; if (['sched', 'half', 'delayed', 'resched'].includes(g.status)) g.status = 'live'; g.startedAt = g.startedAt || Date.now(); }
  c.ts = Date.now(); commitGame(g, true);
}
function adjClockSheet(g) {
  const c = g.clock, rem = Math.round(clockRem(c));

async function finishGame(g) {
  const sc = scoreOf(g);
  if (sc.H === sc.A && !(await confirmSheet('El partido está empatado. En básquet no hay empate: lo normal es jugar un suplementario. ¿Lo finalizás igual?', 'Finalizar igual', true))) return;
  if (sc.H !== sc.A && !(await confirmSheet('¿Finalizar el partido? Queda como resultado oficial y actualiza la tabla.', 'Finalizar'))) return;
  g.clock.rem = clockRem(g.clock); g.clock.running = false; g.clock.ts = Date.now(); g.status = 'final'; g.endedAt = Date.now();
  commitGame(g, true); UI.gtab = 'acta';
  const a = await Ledger.close(g); toast('🏁 Partido finalizado · acta ' + Ledger.short(a.hash));
}

function resizeImage(file, size = 128, png) {
  return new Promise((res, rej) => {
    const fr = new FileReader(); fr.onerror = rej;
    fr.onload = () => { const im = new Image(); im.onerror = rej; im.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d');
      if (!png) { x.fillStyle = '#fff'; x.fillRect(0, 0, size, size); }
      const r = Math.min(size / im.width, size / im.height), w = im.width * r, h = im.height * r;
      x.drawImage(im, (size - w) / 2, (size - h) / 2, w, h); res(png ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.82));
    }; im.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

const pinInputs = (a, b) => `<input class="inp mono" id="pi1" type="password" inputmode="numeric" maxlength="8" placeholder="${a}" style="font-size:22px;letter-spacing:.3em;text-align:center"><input class="inp mono" id="pi2" type="password" inputmode="numeric" maxlength="8" placeholder="${b}" style="font-size:22px;letter-spacing:.3em;text-align:center;margin-top:8px">`;
function readPins(s, allowEmpty) { const a = $('#pi1', s).value.trim(), b = $('#pi2', s).value.trim(); if (allowEmpty && !a && !b) return ''; if (!/^\d{4,8}$/.test(a)) { toast('El PIN tiene que tener de 4 a 8 números', true); return null; } if (a !== b) { toast('Los PIN no coinciden', true); return null; } return a; }
function pinSheet() {
  openSheet('PIN de administración', `<p class="note" style="margin-bottom:10px">De 4 a 8 números. Es solo para quien configura el torneo; los operadores tienen su propio PIN.</p>${pinInputs('Nuevo PIN', 'Repetilo')}<div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn pri" id="piOk">Guardar PIN</button></div>`, s => {
    $('#piOk', s).onclick = () => { const a = readPins(s); if (!a) return; if (S.meta.ops.some(o => o.pin === pinHash(a))) return toast('Ese PIN ya lo usa un operador', true); S.meta.pin = pinHash(a); setRole({ r: 'admin', h: S.meta.pin }); closeSheet(); commitMeta(); toast('PIN guardado'); };
    setTimeout(() => $('#pi1', s).focus(), 60);

}
function opSheet(id) {
  const o = id ? S.meta.ops.find(x => x.id === id) : null;
  openSheet(o ? 'Editar operador' : 'Nuevo operador', `<div class="field"><label>Nombre</label><input class="inp" id="oN" value="${esc(o ? o.name : '')}" maxlength="30" placeholder="Ej: Mesa Cutral Có"></div>
   <div class="field"><label>Sede que carga</label><select class="inp" id="oV"><option value="">Todas las sedes</option>${S.meta.venues.map(v => `<option value="${v.id}" ${o && o.venue === v.id ? 'selected' : ''}>${esc(v.name)}${v.city ? ' · ' + esc(v.city) : ''}</option>`).join('')}</select></div>
   <div class="field"><label>${o ? 'Nuevo PIN (dejalo vacío para no cambiarlo)' : 'PIN del operador'}</label>${pinInputs('PIN', 'Repetilo')}</div>
   <div class="row">${o ? `<button class="btn bad" id="oDel">${IC.trash}</button>` : ''}<span class="sp"></span><button class="btn pri" id="oOk">Guardar</button></div>`, s => {
    $('#oOk', s).onclick = () => {
      const name = $('#oN', s).value.trim(); if (!name) return toast('Poné un nombre', true);

      if (p) { const h = pinHash(p); if (h === S.meta.pin || S.meta.ops.some(x => x.pin === h && x !== o)) return toast('Ese PIN ya está en uso, elegí otro', true); }
      if (o) { o.name = name; o.venue = $('#oV', s).value; if (p) o.pin = pinHash(p); }
      else S.meta.ops.push({ id: uid(), name, venue: $('#oV', s).value, pin: pinHash(p) });
      closeSheet(); commitMeta(); toast('Operador guardado');
    };
    if ($('#oDel', s)) $('#oDel', s).onclick = async () => { if (!(await confirmSheet('¿Borrar el operador ' + esc(o.name) + '? Ya no va a poder cargar.', 'Borrar', true))) return; S.meta.ops = S.meta.ops.filter(x => x !== o); commitMeta(); };
  });
}

   <p class="note" style="margin-bottom:12px">La persona entra a la app con ese email y toca <b>Crear mi contraseña</b> la primera vez.</p>
   <div class="row">${o ? `<button class="btn bad" id="sfDel">${IC.trash}</button>` : ''}<span class="sp"></span><button class="btn pri" id="sfOk">Guardar</button></div>`, s => {

  });

async function loadStaff() {
  const box = $('#staffList'); if (!box) return;
  try { const list = await Sync.staffList(); STAFF_CACHE = list;
    box.innerHTML = list.length ? list.map(o => `<div class="list-row" style="padding:8px 0"><span class="vb-pin" style="width:30px;height:30px">${o.role === 'admin' ? IC.lock : IC.teams}</span><div style="flex:1;min-width:0"><b>${esc(o.name || o.email)}</b><div class="mute" style="font-size:12px">${esc(o.email)} · ${o.role === 'admin' ? 'Administración' : 'Operador'} · ${venueById(o.venue) ? esc(venueById(o.venue).name) : 'Todas las sedes'}</div></div><button class="btn sm ghost" data-act="editStaff" data-v="${esc(o.email)}">${IC.edit}</button></div>`).join('') : '<p class="note">Todavía no hay personal cargado.</p>';
  } catch (x) { box.innerHTML = `<p class="note" style="color:var(--bad)">No se pudo leer el personal: ${esc(x.message || x)}. ¿Corriste el script de seguridad en Supabase?</p>`; }
}
let STAFF_CACHE = [];
function loginSheet() {
  openSheet('Ingresar', `<p class="note" style="margin-bottom:10px">Entrá con el email que te dio de alta la administración.</p>
   <div class="field"><label>Email</label><input class="inp" id="lgE" type="email" autocomplete="username"></div>
   <div class="field"><label>Contraseña</label><input class="inp" id="lgP" type="password" autocomplete="current-password"></div>
   <div class="row" style="flex-wrap:wrap"><button class="btn ghost" id="lgNew">Crear mi contraseña</button><span class="sp"></span><button class="btn pri" id="lgOk">Entrar</button></div>`, s => {
    const go = async (fn, ok) => { const em = $('#lgE', s).value.trim(), pw = $('#lgP', s).value; if (!em || pw.length < 6) return toast('Email y contraseña (mínimo 6 caracteres)', true);
      try { const r = await fn(em, pw); closeSheet(); toast(ok(r)); render(); } catch (x) { toast(/Invalid login/i.test(x.message || '') ? 'Email o contraseña incorrectos' : (x.message || 'No se pudo ingresar'), true); } };
    $('#lgOk', s).onclick = () => go((a, b) => Sync.login(a, b), st => st ? `Hola ${st.name || st.email}: ${st.role === 'admin' ? 'entraste como administración' : 'ya podés cargar' + (venueById(st.venue) ? ' en ' + venueById(st.venue).name : '')}` : 'Entraste, pero tu email no está en el personal de este torneo');
    $('#lgNew', s).onclick = () => go((a, b) => Sync.signup(a, b), d => d && d.session ? 'Contraseña creada' : 'Contraseña creada. Si te pide confirmar, revisá tu email.');
    $('#lgP', s).onkeydown = ev => { if (ev.key === 'Enter') $('#lgOk', s).click(); }; setTimeout(() => $('#lgE', s).focus(), 60);
  });
}
function unlockSheet() {
  if (cloudMode()) return loginSheet();
  openSheet('Ingresar', `<p class="note" style="margin-bottom:10px">Ingresá tu PIN de operador o de administración.</p><input class="inp mono" id="ulP" type="password" inputmode="numeric" maxlength="8" style="font-size:24px;letter-spacing:.35em;text-align:center"><div class="row" style="margin-top:12px"><span class="sp"></span><button class="btn pri" id="ulOk">Entrar</button></div>`, s => {
    const go = () => {
      const h = pinHash($('#ulP', s).value.trim());
      if (S.meta.pin && h === S.meta.pin) { setRole({ r: 'admin', h }); closeSheet(); toast('Entraste como administración'); render(); return; }
      const o = S.meta.ops.find(x => x.pin === h);
      if (o) { setRole({ r: 'op', h, op: o.id }); closeSheet(); toast('Hola ' + o.name + ': ya podés cargar' + (venueById(o.venue) ? ' en ' + venueById(o.venue).name : '')); render(); return; }
      toast('PIN incorrecto', true); $('#ulP', s).value = '';
    };
    $('#ulOk', s).onclick = go; $('#ulP', s).onkeydown = e => { if (e.key === 'Enter') go(); }; setTimeout(() => $('#ulP', s).focus(), 60);
  });
}
function loadScript(src) { return new Promise((res, rej) => { if ($$('script').some(s => s.src === src)) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar ' + src)); document.head.appendChild(s); }); }
async function qrSheet(url, label) {
  openSheet('QR · ' + label, `<div id="qrBox" style="background:#fff;border-radius:16px;padding:16px;display:grid;place-items:center;min-height:240px;color:#111">Generando…</div><p class="note" style="margin-top:10px;text-align:center">Escaneá con la cámara del celular. Podés hacer captura de pantalla para imprimirlo.</p>`);
  try { await loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js'); const q = qrcode(0, 'M'); q.addData(url); q.make(); const b = $('#qrBox'); if (b) { b.innerHTML = q.createSvgTag({ cellSize: 7, margin: 1, scalable: true }); const sv = b.querySelector('svg'); sv.style.width = 'min(300px,70vw)'; sv.style.height = 'auto'; } }
  catch (e) { const b = $('#qrBox'); if (b) b.textContent = 'No se pudo generar el QR sin internet.'; }
}

const tvBadge = (t, w, fs, r) => { const lg = S.logos[t.id] && S.logos[t.id].d; return lg ? `<span class="badge logo" style="width:${w};height:${w};border-radius:${r}"><img src="${lg}" alt=""></span>` : `<span class="badge" style="width:${w};height:${w};font-size:${fs};border-radius:${r};background:${esc(t.color)}">${esc(t.short)}</span>`; };
function tvGame() {
  const id = QP.get('g'); if (id && S.games[id] && !S.games[id].deleted) return S.games[id];
  const v = QP.get('sede'), gs = gamesArr().filter(g => !v || g.venue === v);

    if (f.length) openSheet('Programación', `<p style="margin-bottom:10px"><b>${n}</b> partidos programados. <b style="color:var(--hot)">${f.length} no entraron</b> respetando descansos y traslados:</p>${f.slice(0, 20).map(g => `<div class="acta-r"><span>${esc((catById(g.cat) || {}).name || '')} · ${esc(phaseLabel(g))}</span><b>${esc(sideInfo(g, 'H').label)} vs ${esc(sideInfo(g, 'A').label)}</b></div>`).join('')}<p class="note" style="margin-top:10px">Probá agregar un día, extender el horario de las canchas, achicar el intervalo o bajar el descanso mínimo.</p>`);
    else toast(n ? n + ' partidos programados respetando descansos y traslados' : 'No había partidos para programar (o no hay días/sedes)', !n); },
  addOp: () => opSheet(null),
  editOp: el => opSheet(el.dataset.id),
  genFixture: async el => {
    const c = catById(el.dataset.id); if (!c) return; const n = catTeams(c.id).length; if (n < 2) return toast(`${c.name} necesita al menos 2 equipos`, true);
    if (c.format === 'groups') { for (let gi = 0; gi < c.groups; gi++) if (groupTeams(c.id, gi).length < 2) return toast('El grupo ' + GL[gi] + ' de ' + c.name + ' tiene menos de 2 equipos. Revisá los grupos en cada equipo.', true); }
    const played = gamesArr(c.id).filter(g => g.events.length).length;
    const msg = gamesArr(c.id).length ? `Se arma un fixture nuevo para <b>${esc(c.name)}</b> y se borra el actual${played ? ` <b>(incluye ${played} partidos con jugadas cargadas)</b>` : ''}. ¿Seguimos?` : `Se crean los partidos de <b>${esc(c.name)}</b> (${FMT_NAMES[c.format]}). ¿Seguimos?`;
    if (!(await confirmSheet(msg, 'Generar', !!played))) return;
    const k = generateFixture(c.id); toast(`${c.name}: ${k} partidos. Ahora programalos con días, horarios y sedes.`);
  },
  copy: async el => { try { await navigator.clipboard.writeText(el.dataset.v); toast('Link copiado'); } catch (e) { prompt('Copiá el link:', el.dataset.v); } },
  qr: el => qrSheet(el.dataset.v, el.dataset.l),
  cloudSave: async () => {
    const u = $('#cU').value.trim().replace(/\/$/, ''), k = $('#cK').value.trim(), code = $('#cC').value.trim().toUpperCase();
    if (!/^https:\/\/.+/.test(u) || k.length < 20) return toast('Revisá la URL y la clave', true);
    if (code && code !== S.meta.code) {
      if (!(await confirmSheet(`Te vas a sumar al torneo <b>${esc(code)}</b>. Lo que hay en este dispositivo se reemplaza por lo que está en la nube.`, 'Sumarme'))) return;
      S = { meta: { ...blankMeta(), code, ts: 0, name: 'Cargando…' }, games: {}, logos: {} };
    }
    localStorage.setItem(LSC, JSON.stringify({ u, k })); saveLocal(); await Sync.start(); render(); toast(Sync.st === 'err' ? 'No se pudo conectar' : 'Conectado a la nube');
  },
  cloudOff: async () => { if (!(await confirmSheet('¿Desconectar la nube en este dispositivo? Los datos quedan guardados acá.', 'Desconectar'))) return; localStorage.removeItem(LSC); Sync.start(); render(); },
  setPin: () => pinSheet(),
  lock: async () => { if (cloudMode()) await Sync.logout(); setRole(null); toast('Sesión cerrada en este dispositivo'); render(); },
  addStaff: () => staffSheet(null),
  ageRef: el => { S.meta.ageRef = el.dataset.v; commitMeta(); },
  tLogoReset: () => { delete S.logos.__torneo; S.logos.__torneo_del = { ts: Date.now() }; commitLogo('__torneo_del'); applyBrand(); },
  editStaff: el => staffSheet(STAFF_CACHE.find(o => o.email === el.dataset.v)),
  unlock: () => unlockSheet(),
  theme: el => { setTheme(el.dataset.v); render(); },
  bgmode: el => { BG.set(el.dataset.v); render(); },
  export: () => { const b = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'maxibasquet-cutralco-' + S.meta.code + '-' + new Date().toISOString().slice(0, 10) + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Respaldo descargado'); },
  wipe: async () => { if (!(await confirmSheet('¿Borrar todo y empezar de cero en este dispositivo? Descargá un respaldo antes si lo necesitás.', 'Borrar todo', true))) return; const keep = { code: S.meta.code, pin: S.meta.pin }; S = { meta: Object.assign(blankMeta(), keep), games: {}, logos: {} }; commitMeta(); location.hash = '#/inicio'; }
};
const CHANGES = {
  tLogo: async el => { const f = el.files[0]; if (!f || !isAdmin()) return; try { const d = await resizeImage(f, 384, true); S.logos.__torneo = { d, ts: Date.now() }; delete S.logos.__torneo_del; commitLogo('__torneo'); applyBrand(); toast('Logo del torneo actualizado'); } catch (x) { toast('No se pudo leer esa imagen', true); } },
  hpid: el => { UI.heat.pid = el.value; render(); },
  addDay: el => { if (!el.value || !isAdmin()) return; if (!S.meta.days.includes(el.value)) { S.meta.days.push(el.value); S.meta.days.sort(); commitMeta(); } el.value = ''; },
  import: el => { const f = el.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = async () => { try { const d = JSON.parse(rd.result); if (!d.meta || !d.games) throw 0; if (!(await confirmSheet('¿Reemplazar el torneo actual por el del respaldo?', 'Importar', true))) return; d.meta.ts = Date.now(); S = d; migrate(); Object.values(S.games).forEach(g => g.mts = Date.now()); commitMeta(); Object.keys(S.games).forEach(id => Sync.push({ k: 'g', id })); Object.keys(S.logos).forEach(id => Sync.push({ k: 'logo', id })); Sync.openBC(); toast('Respaldo importado'); } catch (e) { toast('Ese archivo no es un respaldo válido', true); } }; rd.readAsText(f); }
};
Object.assign(ACTIONS, DIR_ACTIONS, VOTE_ACTIONS, P3D_ACTIONS);
document.addEventListener('click', e => {
  const tl = e.target.closest('a[data-tab]'); if (tl) { const id = (tl.getAttribute('href').match(/partido\/([^/]+)/) || [])[1]; if (id) { UI.gtabFor = id; UI.gtab = tl.dataset.tab; } }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACTIONS[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.actChange && CHANGES[el.dataset.actChange]) return CHANGES[el.dataset.actChange](el);
  if (!isAdmin()) return;
  const num = (v, a, b) => { v = parseInt(v, 10); return isNaN(v) ? null : clamp(v, a, b); };
  if (el.dataset.meta) {
    const k = el.dataset.meta; let v = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.num !== undefined) { v = num(v, +el.min || 1, +el.max || 99); if (v == null) return; el.value = v; }
    else if (typeof v === 'string') v = v.trim();
    if (k === 'name' && !v) return;
    S.meta[k] = v; commitMeta(); return;
  }
  if (el.dataset.catf) {
    const c = catById(el.dataset.id); if (!c) return; const f = el.dataset.catf;
    if (f === 'allowDouble') c.allowDouble = el.checked; else if (f === 'minAge' || f === 'maxAge' || f === 'maxRoster') { const v = num(el.value, 0, 99); if (v == null) return; c[f] = v; } else if (f === 'third') c.third = el.checked; else if (f === 'groups') { const v = num(el.value, 1, 8); if (v == null) return; c.groups = v; autoGroups(c.id); } else if (f === 'adv') { const v = num(el.value, 1, 4); if (v == null) return; c.adv = v; }
    else if (f === 'name') { const v = el.value.trim(); if (!v) return; c.name = v; } else if (f === 'format') { c.format = el.value; if (c.format === 'groups') autoGroups(c.id); }
    commitMeta(); return;
  }
  if (el.dataset.venf) { const v = venueById(el.dataset.id); if (!v) return; v[el.dataset.venf] = el.value.trim(); commitMeta(); }
});
document.addEventListener('focusout', () => setTimeout(() => { if (pendingRender) render(); }, 50));
$('#roleChip').addEventListener('click', () => {
  if (MODE !== 'full') return;
  if (cloudMode()) { if (canWrite() || Sync.session) ACTIONS.lock(); else loginSheet(); return; }
  if (!S.meta.pin) { location.hash = '#/ajustes'; toast('Poné un PIN de administración para proteger la carga'); return; }
  if (canWrite()) ACTIONS.lock(); else unlockSheet();
});

/* =====================================================================
   RELOJ EN VIVO
   ===================================================================== */
let lastTick = 0, lastBeat = 0;
function tick(force) {
  const now = Date.now(); if (!force && now - lastTick < 180) return; lastTick = now;
  $$('[data-clk]').forEach(el => { const g = S.games[el.dataset.clk]; if (!g || g.status === 'final') return; el.textContent = mmss(clockRem(g.clock)); el.classList.toggle('run', !!g.clock.running); });
  $$('[data-prog]').forEach(el => { const g = S.games[el.dataset.prog]; if (!g || g.status === 'final') return; el.style.width = Math.round((perLen(g.clock.period) - clockRem(g.clock)) / perLen(g.clock.period) * 100) + '%'; });
  if (MODE === 'full' && canWrite()) gamesArr().forEach(g => {
    if (!canEdit(g) || !g.clock.running || clockRem(g.clock) > 0) return;
    if (g.lock && g.lock.dev !== DEV && now - g.lock.ts < 90000) return;
    g.clock.rem = 0; g.clock.running = false; g.clock.ts = now;
    if (g.clock.period === Math.ceil(S.meta.quarters / 2)) g.status = 'half';
    commitGame(g, true);
    if (curGame() === g) { toast(g.status === 'half' ? '⏱ Entretiempo' : '⏱ Fin del ' + perLong(g.clock.period)); try { navigator.vibrate && navigator.vibrate([300, 120, 300]); } catch (e) { } }
  });
  if (now - lastBeat > 40000) { lastBeat = now; const [r, a] = route(); const g = r === 'partido' && S.games[a]; if (g && UI.gtab === 'console' && canEdit(g) && lockInfo(g).mine) takeLock(g); }
}
setInterval(() => tick(), 200);

/* =====================================================================
   TEMA · PWA · ACTUALIZACIONES · ARRANQUE
   ===================================================================== */
/* identidad: PIQUE (Plataforma MLF) + logo del torneo activo */
const torneoLogo = () => S.logos.__torneo && !(S.logos.__torneo_del && S.logos.__torneo_del.ts > S.logos.__torneo.ts) ? S.logos.__torneo.d : null;
function applyBrand() { const b = $('#brandLogo'); if (b) b.src = torneoLogo() || LOGO; $$('.logo-anim').forEach(el => { if ((el.dataset.built || '') !== (torneoLogo() ? 'img' : '1')) el.dataset.built = ''; }); }
function setTheme(v) {
  localStorage.setItem('tbf_theme', v);
  const dark = v === 'dark' || (v === 'auto' && !matchMedia('(prefers-color-scheme: light)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  $('meta[name="theme-color"]').content = '#07A4B3';
  $('#themeBtn').innerHTML = dark ? IC.sun : IC.moon;
  BG.colors();
}
$('#themeBtn').addEventListener('click', () => { setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); render(); });
matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if ((localStorage.getItem('tbf_theme') || 'auto') === 'auto') { setTheme('auto'); render(); } });
function setupPWA() {
  const man = { name: BRAND.name + ' · ' + S.meta.name, short_name: BRAND.name, description: BRAND.name + ' · ' + BRAND.tag + ' · ' + BRAND.by, start_url: location.pathname + location.search, scope: location.pathname, display: 'standalone', orientation: 'any', background_color: '#0C1013', theme_color: '#0B2328',
    icons: [{ src: BRAND.i192, sizes: '192x192', type: 'image/png', purpose: 'any' }, { src: BRAND.i512, sizes: '512x512', type: 'image/png', purpose: 'any' }, { src: BRAND.mask, sizes: '512x512', type: 'image/png', purpose: 'maskable' }] };
  const icon = BRAND.i192;
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: 'application/manifest+json' })); document.head.appendChild(l);
  const fi = document.createElement('link'); fi.rel = 'icon'; fi.href = icon; document.head.appendChild(fi);
  const ai = document.createElement('link'); ai.rel = 'apple-touch-icon'; ai.href = BRAND.i180; document.head.appendChild(ai);
  [['apple-mobile-web-app-title', BRAND.name], ['application-name', BRAND.name], ['apple-mobile-web-app-capable', 'yes'], ['mobile-web-app-capable', 'yes']].forEach(([n, c]) => { const m = document.createElement('meta'); m.name = n; m.content = c; document.head.appendChild(m); });
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('./sw.js').catch(() => { });
}
async function checkUpdate() {
  if (!/^https?:/.test(location.protocol)) return;
  try {
    const t = await (await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' })).text();
    const m = t.match(/name="app-version" content="([^"]+)"/);
    if (m && m[1] !== VERSION && !$('#upd')) {
      const d = document.createElement('div'); d.className = 'upd'; d.id = 'upd';
      d.innerHTML = `<span style="flex:1">Hay una versión nueva (${esc(m[1])})</span><button class="btn sm" onclick="location.reload()">Actualizar</button>`;
      document.body.appendChild(d);
    }
  } catch (e) { }
}
function boot() {
  $('#verTxt').textContent = VERSION;
  setTheme(localStorage.getItem('tbf_theme') || 'auto');
  $('#setBtn').innerHTML = IC.gear; applyBrand();
  loadLocal();
  const cp = QP.get('c');
  if (cp) {
    try {
      const j = JSON.parse(decodeURIComponent(escape(atob(cp.replace(/-/g, '+').replace(/_/g, '/')))));
      if (j.u && j.k) localStorage.setItem(LSC, JSON.stringify({ u: j.u, k: j.k }));
      if (j.c && j.c !== S.meta.code) { S = { meta: { ...blankMeta(), code: j.c, ts: 0, name: 'Cargando torneo…' }, games: {}, logos: {} }; saveLocal(); }
    } catch (e) { console.warn('Link inválido', e); }
  }
  setupPWA();
  render();
  BG.start();
  LogoFX.start();
  Sync.start();
  window.addEventListener('hashchange', () => { closePop(); closeStrip(); window.scrollTo(0, 0); render(); });
  window.addEventListener('online', () => { if (Sync.cl && Sync.session && (!Sync.staff || Sync.staffStale)) { Sync.staffStale = false; Sync.onAuth(Sync.session, true); } Sync.flush(); Sync.pull(); setTimeout(() => Ledger.retry(), 2500); });
  window.addEventListener('resize', () => { clearTimeout(window.__rz); window.__rz = setTimeout(render, 200); });
  window.addEventListener('storage', e => { if (e.key === LSK && e.newValue) { try { const d = JSON.parse(e.newValue); if (d.meta.code === S.meta.code) { Sync.mergeMeta(d.meta); Object.values(d.games).forEach(g => Sync.mergeGame(g)); Object.entries(d.logos || {}).forEach(([k, v]) => Sync.mergeLogo(k, v)); scheduleRender(); } } catch (x) { } } });
  setTimeout(checkUpdate, 8000); setInterval(checkUpdate, 5 * 60000);
}
boot();
